# ── LaneSync-managed workflow ─────────────────────────────────────────────
# This file is owned by LaneSync. Future "Update workflows" PRs may replace
# custom edits you make here. Review the PR diff before merging.
name: "CI — Build & Test"

# Working Python CI — generated by LaneSync.
# Runs pytest with HTML + coverage reports and uploads evidence to LaneSync.

on:
  pull_request:
    branches: [ "master", "release/*" ]
  push:
    branches: [ "master", "release/*" ]
  release:
    types: [published]

jobs:
  build:
    name: "CI — Build & Test"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html pytest-cov
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          [ -f pyproject.toml ] && pip install -e . || true

      - name: Run unit tests
        run: |
          # Line coverage measures your code, not your tests: test files are always ~100% covered
          # and would inflate the coverage gate. Paths stay relative to the repository root.
          # A coverage config of your own (.coveragerc, [tool.coverage.*] in pyproject.toml,
          # [coverage:*] in setup.cfg or tox.ini) takes precedence over these defaults.
          if [ -f .coveragerc ] || grep -qs '^\[tool\.coverage' pyproject.toml \
            || grep -qs '^\[coverage:' setup.cfg tox.ini; then
            COV_ARGS="--cov"
          else
            COV_RC="${RUNNER_TEMP:-/tmp}/lanesync-coveragerc"
            printf '%s\n' '[run]' 'omit =' \
              '    tests/*' '    test/*' '    */tests/*' '    */test/*' \
              '    test_*.py' '    */test_*.py' '    *_test.py' \
              '    conftest.py' '    */conftest.py' '    setup.py' \
              '    .venv/*' '    venv/*' '    build/*' '    dist/*' > "$COV_RC"
            COV_ARGS="--cov=. --cov-config=$COV_RC"
          fi
          pytest --html=unit-tests.html --self-contained-html \
                 --junitxml=pytest-junit.xml \
                 $COV_ARGS --cov-report=html:coverage --cov-report=xml:coverage/cobertura.xml 2>/dev/null || TEST_EXIT=$?
          [ "${TEST_EXIT:-0}" -eq 5 ] && TEST_EXIT=0
          [ -f unit-tests.html ] || echo "<html><body><h1>Unit Tests</h1><p>No tests yet — add pytest tests to get started.</p></body></html>" > unit-tests.html
          mkdir -p coverage
          [ -f coverage/index.html ] || echo "<html><body><h1>Coverage</h1></body></html>" > coverage/index.html
          echo "<html><body><h1>Integration Tests</h1><p>Configure integration tests here.</p></body></html>" > integration-tests.html
          exit ${TEST_EXIT:-0}

      # ── Integration tests (uncomment and adapt) ──
      # - name: Run integration tests
      #   run: |
      #     pytest tests/integration --html=integration-tests.html --self-contained-html
      #     # Or merge integration results into integration-tests.html for LaneSync evidence.

      - name: SAST scan (OpenGrep)
        if: always()
        env:
          OPENGREP_VERSION: v1.22.0
          OPENGREP_INSTALL_SHA: f458d7f0d52cc58eae1ca3cf3d5caf101e637519
        run: |
          curl -fsSL "https://raw.githubusercontent.com/opengrep/opengrep/${OPENGREP_INSTALL_SHA}/install.sh" \
            | bash -s -- -v "$OPENGREP_VERSION" || true
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
          # Scan source only: generated reports, virtualenvs and build output are not the customer's code.
          # Findings never fail CI (no --error), so a non-zero exit means the scan itself failed:
          # send no report rather than a partial one that reads as clean.
          if ! opengrep scan --config auto --exclude .github --exclude coverage --exclude unit-tests.html \
            --exclude integration-tests.html --exclude htmlcov --exclude .venv --exclude venv \
            --exclude build --exclude dist \
            --sarif -o sast.sarif . 2>/dev/null; then
            echo "::warning::SAST scan did not complete; LaneSync will show SAST as not measured."
            rm -f sast.sarif
          fi

      - name: CVE scan (Trivy)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ github.sha }}
          path: |
            unit-tests.html
            integration-tests.html
            sast.sarif
            trivy.json
            pytest-junit.xml
            coverage/
          retention-days: 30

      - name: Upload evidence to LaneSync
        uses: ./.github/actions/lanesync-upload
        if: always()
        with:
          api-url: ${{ vars.SDLC_API_URL || 'https://lanesync.dev' }}
          api-key: ${{ secrets.LANESYNC_API_KEY }}
          dev-branch: "master"
          release-prefix: "release/"
          pipeline: "CI — Build & Test"

  tag:
    name: Auto-Tag on Push
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate and Push Tag
        run: |
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          if [[ "$BRANCH_NAME" == "master" ]]; then
            NEW_TAG="dev-${SHA_SHORT}"
          # Release candidates are tagged <release>-rc.<N> by LaneSync when it pins them (#155).
          else
            echo "Branch not targeted for auto-tagging."; exit 0
          fi
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $NEW_TAG"
            exit 0
          fi
          git tag "$NEW_TAG"
          if git push origin "$NEW_TAG"; then
            echo "Pushed tag: $NEW_TAG"
          else
            echo "GITHUB_TOKEN could not push ${NEW_TAG}. LaneSync creates it with the app installation token."
          fi
