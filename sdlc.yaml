version: v1
name: httpie-cli
traceability:
  mode: warn
release_naming:
  format: semver-v-strict
  mapping: R1
stages:
  planning:
    require_milestone: true
    require_issues_assigned: true
  development:
    branch: master
    deploy_target: dev
    required_checks:
      - CI — Build & Test
    required_reviewers:
      min_approvals: 1
  testing:
    branch_pattern: release/**
    required_checks:
      - CI — Build & Test
    required_reviewers:
      min_approvals: 1
  evidencing:
    required_reviewers:
      min_approvals: 1
  deployment:
    target: production
    deploy_workflow: .github/workflows/release-pypi.yml
    required_checks: []
    promotion: manual
    requires_evidence_approval: true
